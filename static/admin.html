<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #FDF6EE; --bg-card: #FFFFFF; --bg-secondary: #F2E8DC;
  --accent: #A8C9A5; --accent-dark: #8B9D83; --highlight: #F4C7AB;
  --border: #E8D5C4; --text: #4A3F35; --text-muted: #9C8B7A;
  --radius: 16px; --shadow: 0 2px 12px rgba(74,63,53,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #2A2520; --bg-card: #3A3430; --bg-secondary: #322D28;
    --border: #4A4440; --text: #E8DDD4; --text-muted: #9C8F82;
    --shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC','PingFang SC',sans-serif; background:var(--bg); color:var(--text); }
.container { max-width:1200px; margin:0 auto; padding:20px; }
.card { background:var(--bg-card); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); margin-bottom:20px; }
h1 { font-size:1.5em; margin-bottom:24px; }
h2 { font-size:1.15em; margin-bottom:16px; color:var(--accent-dark); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:768px) { .grid { grid-template-columns:1fr; } }

.user-tabs { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.user-tab { padding:10px 24px; border:2px solid var(--border); border-radius:10px; background:var(--bg-card); cursor:pointer; font-size:0.95em; transition:all 0.2s; color:var(--text); }
.user-tab.active { border-color:var(--accent); background:var(--bg-secondary); font-weight:600; }
.user-tab:hover { border-color:var(--accent); }

.header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.header-bar h1 { margin-bottom:0; }

.stats-value { font-size:2.2em; font-weight:700; color:var(--accent-dark); }
.stats-label { font-size:0.85em; color:var(--text-muted); margin-top:4px; }

.chart-container { height:260px; position:relative; }

.login-screen { max-width:400px; margin:120px auto; text-align:center; }
.login-screen h1 { font-size:1.8em; margin-bottom:8px; }
.login-screen p { color:var(--text-muted); margin-bottom:24px; }
.login-screen input { width:100%; padding:14px; border:2px solid var(--border); border-radius:10px; font-size:1em; margin-bottom:16px; outline:none; background:var(--bg-card); color:var(--text); }
.login-screen input:focus { border-color:var(--accent); }
.login-screen button { width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:1.05em; cursor:pointer; transition:background 0.2s; }
.login-screen button:hover { background:var(--accent-dark); }

.auth-hidden { display:none; }

.heatmap-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; font-size:0.78em; }
.heatmap-weekday { text-align:center; color:var(--text-muted); padding:6px 0; font-weight:500; }
.heatmap-cell {
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border-radius:8px; font-size:0.85em; position:relative;
}
.heatmap-cell.today { font-weight:700; box-shadow:inset 0 0 0 2px var(--highlight); }
.heatmap-cell.future { opacity:0.3; }
.heatmap-cell.clickable { cursor:pointer; transition:transform 0.15s; }
.heatmap-cell.clickable:hover { transform:scale(1.15); z-index:1; }
.heatmap-cell.selected { box-shadow:inset 0 0 0 3px #F4C7AB, 0 2px 8px rgba(0,0,0,0.2); }

.date-detail-card { margin-top:16px; background:var(--bg-secondary); border-radius:12px; padding:16px 20px; }
.date-detail-card h3 { font-size:1em; margin-bottom:12px; color:var(--accent-dark); }
.date-habit-item { display:flex; align-items:center; gap:10px; padding:6px 0; }
.date-habit-item .dh-check { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8em; font-weight:700; }
.date-habit-item .dh-check.done { background:var(--accent); color:white; }
.date-habit-item .dh-check.undone { background:var(--border); color:white; }
.date-habit-item .dh-label { flex:1; font-size:0.9em; }
.date-habit-item .dh-points { font-size:0.8em; color:var(--text-muted); }

.stat-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
.stat-card { background:var(--bg-card); border-radius:12px; padding:16px; text-align:center; box-shadow:var(--shadow); }
.stat-card .num { font-size:1.8em; font-weight:700; color:var(--accent-dark); }
.stat-card .lbl { font-size:0.82em; color:var(--text-muted); margin-top:4px; }

.detail-table { width:100%; border-collapse:collapse; font-size:0.9em; }
.detail-table th { text-align:left; padding:10px 6px; border-bottom:2px solid var(--border); color:var(--text-muted); font-weight:500; }
.detail-table td { padding:10px 6px; border-bottom:1px solid var(--border); }
.detail-table tr:hover td { background:var(--bg-secondary); }

.logout-btn {
  background:none; border:1px solid var(--border); border-radius:8px;
  padding:8px 20px; cursor:pointer; font-size:0.9em; transition:background 0.2s; color:var(--text);
}
.logout-btn:hover { background:var(--bg-secondary); }

.habit-item-admin {
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  border:1px solid var(--border); border-radius:10px; margin-bottom:8px;
  background:var(--bg-card); cursor:grab; transition:box-shadow 0.2s, opacity 0.2s;
  user-select:none;
}
.habit-item-admin:hover { box-shadow:0 2px 8px rgba(74,63,53,0.1); }
.habit-item-admin.dragging { opacity:0.5; }
.habit-item-admin.drag-over { border-color:var(--accent); background:var(--bg-secondary); }
.habit-item-admin .drag-handle { cursor:grab; color:var(--text-muted); font-size:1.2em; padding:0 4px; }
.habit-item-admin .habit-info { flex:1; }
.habit-item-admin .habit-pts { background:var(--bg-secondary); padding:2px 10px; border-radius:99px; font-size:0.82em; color:var(--text-muted); }
.habit-edit-btn2, .habit-del-btn2 {
  background:none; border:1px solid var(--border); border-radius:6px;
  padding:4px 12px; cursor:pointer; font-size:0.82em; transition:background 0.2s; color:var(--text);
}
.habit-edit-btn2:hover { background:var(--bg-secondary); }
.habit-del-btn2 { border-color:#E8A0A0; color:#B84A4A; }
.habit-del-btn2:hover { background:#FFF0F0; }
.habit-add-btn {
  background:var(--accent); color:#fff; border:none; border-radius:8px;
  padding:4px 14px; cursor:pointer; font-size:0.85em; float:right; margin-top:2px;
}
.habit-add-btn:hover { background:var(--accent-dark); }
.modal-overlay {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.4); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-card {
  background:var(--bg-card); border-radius:var(--radius); padding:24px;
  width:100%; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.15);
}
.modal-title { font-size:1.1em; font-weight:600; margin-bottom:16px; color:var(--text); }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:0.85em; color:var(--text-muted); margin-bottom:4px; }
.form-group input {
  width:100%; padding:10px 12px; border:2px solid var(--border);
  border-radius:8px; font-size:0.95em; outline:none; background:var(--bg-card); color:var(--text);
}
.form-group input:focus { border-color:var(--accent); }
.modal-actions { display:flex; gap:12px; margin-top:20px; }
.modal-actions button { flex:1; padding:10px; border-radius:8px; font-size:0.95em; cursor:pointer; }
.btn-primary { background:var(--accent-dark); color:white; border:none; }
.btn-secondary { background:var(--bg-secondary); color:var(--text); border:1px solid var(--border); }
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <h1>🔐 管理后台</h1>
  <p>一个月变好计划 · 数据看板</p>
  <input type="password" id="admin-password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')adminLogin()" />
  <button onclick="adminLogin()">登录</button>
</div>

<div id="dashboard" class="auth-hidden container">
  <div class="header-bar">
    <h1>一个月变好 · 管理后台</h1>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </div>

  <div class="user-tabs" id="user-tabs"></div>

  <div class="stat-cards" id="stat-cards"></div>

  <div class="grid">
    <div class="card">
      <h2>📊 月度热力图</h2>
      <div id="heatmap-container" style="min-height:200px;"></div>
      <div id="date-detail" class="date-detail-card" style="display:none;"></div>
    </div>
    <div class="card">
      <h2>📈 每周完成率趋势</h2>
      <div class="chart-container"><canvas id="weeklyChart"></canvas></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>🎯 各习惯完成频率</h2>
      <div class="chart-container"><canvas id="habitChart"></canvas></div>
    </div>
    <div class="card">
      <h2>🏆 积分 & 奖励 <button class="habit-add-btn" onclick="showRewardForm()">+ 新增</button></h2>
      <div id="rewards-summary"></div>
    </div>
  </div>

  <div class="card">
    <h2>📝 习惯管理 <button class="habit-add-btn" onclick="showHabitForm()">+ 新增</button></h2>
    <div id="habit-list"></div>
  </div>

  <div class="card">
    <h2>📋 每日打卡详情</h2>
    <div style="overflow-x:auto;">
      <table class="detail-table" id="detail-table">
        <thead><tr><th>日期</th><th>完成项目</th><th>完成数</th></tr></thead>
        <tbody id="detail-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let currentUserId = null;
let dashboardData = null;
let weeklyChartInstance = null;
let habitChartInstance = null;
let selectedDate = null;

async function adminLogin() {
  const pw = document.getElementById('admin-password').value;
  try {
    const r = await fetch('/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pw})
    });
    if (!r.ok) throw new Error('密码错误');
    localStorage.setItem('mb_admin', '1');
    showDashboard();
    await loadDashboard();
  } catch(e) {
    alert(e.message);
  }
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

function logout() {
  localStorage.removeItem('mb_admin');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('admin-password').value = '';
  if (weeklyChartInstance) { weeklyChartInstance.destroy(); weeklyChartInstance = null; }
  if (habitChartInstance) { habitChartInstance.destroy(); habitChartInstance = null; }
}

/* Auto-login on page load if cached */
(async function() {
  if (localStorage.getItem('mb_admin')) {
    showDashboard();
    try {
      await loadDashboard();
    } catch(e) {
      console.error('Dashboard load failed:', e);
      logout();
    }
  }
})();

async function loadDashboard() {
  const r = await fetch('/api/admin/dashboard');
  if (!r.ok) throw new Error('Failed to load dashboard');
  dashboardData = await r.json();
  if (!dashboardData || dashboardData.length === 0) throw new Error('No user data');
  currentUserId = dashboardData[0].id;
  renderUserTabs();
  renderCurrentUser();
  loadHabits();
}

function renderUserTabs() {
  const container = document.getElementById('user-tabs');
  container.innerHTML = dashboardData.map(u =>
    `<button class="user-tab ${u.id === currentUserId ? 'active' : ''}" onclick="switchUser('${u.id}')">${u.emoji} ${u.display_name}</button>`
  ).join('');
}

function switchUser(uid) {
  currentUserId = uid;
  selectedDate = null;
  document.getElementById('date-detail').style.display = 'none';
  renderUserTabs();
  renderCurrentUser();
}

function renderCurrentUser() {
  const user = dashboardData.find(u => u.id === currentUserId);
  if (!user) return;
  renderStatCards(user);
  renderHeatmap(user);
  renderWeeklyChart(user);
  renderHabitChart(user);
  renderRewards(user);
  renderDailyDetail(user);
}

function renderStatCards(user) {
  const freq = user.habit_frequency || {};
  const totalHabits = Object.keys(freq).length;
  const totalRecords = Object.values(user.daily_records || {}).reduce((sum, arr) => sum + arr.length, 0);
  const daysWithRecords = Object.keys(user.daily_records || {}).length;
  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card"><div class="num">${user.total_raw_points}</div><div class="lbl">累计积分</div></div>
    <div class="stat-card"><div class="num">${totalHabits}</div><div class="lbl">习惯数</div></div>
    <div class="stat-card"><div class="num">${totalRecords}</div><div class="lbl">总打卡次数</div></div>
    <div class="stat-card"><div class="num">${daysWithRecords}</div><div class="lbl">打卡天数</div></div>
  `;
}

function renderHeatmap(user) {
  const container = document.getElementById('heatmap-container');
  const records = user.daily_records || {};
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstDay = new Date(year, month - 1, 1).getDay();
  const todayStr = today.toISOString().slice(0,10);
  const hCount = Object.keys(user.habit_frequency || {}).length;

  let html = '<div class="heatmap-grid">';
  ['日','一','二','三','四','五','六'].forEach(d => { html += `<div class="heatmap-weekday">${d}</div>`; });
  for (let i = 0; i < firstDay; i++) { html += '<div></div>'; }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayData = records[dateStr] || [];
    const doneCount = dayData.length;
    const isToday = dateStr === todayStr;
    const isFuture = dateStr > todayStr;
    const isSelected = dateStr === selectedDate;
    const pct = hCount ? Math.round(doneCount / hCount * 100) : 0;

    let bg = 'var(--bg-secondary)';
    if (isFuture) bg = 'transparent';
    else if (doneCount === hCount && hCount > 0) bg = 'var(--accent)';
    else if (doneCount > 0) bg = `rgba(168,201,165,${0.2 + (pct / 100) * 0.6})`;

    const onclick = isFuture ? '' : `onclick="showDateDetail('${dateStr}')"`;
    html += `<div class="heatmap-cell ${isToday ? 'today' : ''} ${isFuture ? '' : 'clickable'} ${isSelected ? 'selected' : ''}" style="background:${bg}" ${onclick}>${d}</div>`;
  }
  html += '</div>';
  container.innerHTML = html;

  // Refresh detail if a date is selected
  if (selectedDate) showDateDetail(selectedDate);
}

function showDateDetail(dateStr) {
  selectedDate = dateStr;
  const user = dashboardData.find(u => u.id === currentUserId);
  if (!user) return;

  const freq = user.habit_frequency || {};
  const dayRecords = (user.daily_records || {})[dateStr] || [];
  const allHabits = Object.entries(freq).sort((a, b) => (a[1].sort_order ?? 99) - (b[1].sort_order ?? 99));

  const container = document.getElementById('date-detail');
  container.style.display = 'block';

  const doneCount = dayRecords.length;
  const totalCount = allHabits.length;
  const dayPoints = allHabits.reduce((sum, [key, info]) => sum + (dayRecords.includes(key) ? info.points : 0), 0);

  container.innerHTML = `
    <h3>📅 ${dateStr} · ${doneCount}/${totalCount} 完成 · ${dayPoints} 分</h3>
    ${allHabits.map(([key, info]) => {
      const done = dayRecords.includes(key);
      return `
        <div class="date-habit-item">
          <div class="dh-check ${done ? 'done' : 'undone'}">${done ? '✓' : '·'}</div>
          <span class="dh-label">${info.label}</span>
          <span class="dh-points">${done ? '+' + info.points : '—'}</span>
        </div>`;
    }).join('')}
  `;

  // Refresh heatmap to show selected cell
  renderHeatmap(user);
}

function renderWeeklyChart(user) {
  if (weeklyChartInstance) { weeklyChartInstance.destroy(); }
  const ctx = document.getElementById('weeklyChart').getContext('2d');
  const records = user.daily_records || {};
  const today = new Date();
  const weeks = [];
  const rates = [];

  for (let w = 7; w >= 0; w--) {
    let weekStart = new Date(today);
    weekStart.setDate(today.getDate() - today.getDay() - w * 7);
    let done = 0, total = 0;
    const hCount = Object.keys(user.habit_frequency || {}).length;

    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate() + i);
      const dateStr = d.toISOString().slice(0,10);
      const dayData = records[dateStr] || [];
      done += dayData.length;
      total += hCount;
    }
    const label = w === 0 ? '本周' : `-${w}周`;
    weeks.push(label);
    rates.push(total ? Math.round(done / total * 100) : 0);
  }

  weeklyChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: weeks,
      datasets: [{
        label: '完成率',
        data: rates,
        borderColor: '#A8C9A5',
        backgroundColor: 'rgba(168,201,165,0.15)',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: '#F4C7AB',
        pointBorderColor: '#8B9D83',
        pointRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } },
      plugins: { legend: { display: false } }
    }
  });
}

function renderHabitChart(user) {
  if (habitChartInstance) { habitChartInstance.destroy(); }
  const ctx = document.getElementById('habitChart').getContext('2d');
  const freq = user.habit_frequency || {};
  const labels = Object.values(freq).map(h => h.label);
  const data = Object.values(freq).map(h => h.count);
  const colors = ['#A8C9A5','#F4C7AB','#E8D5C4','#8B9D83','#B5D0B2','#D4C4B0','#C9B8A4','#BFC9B6','#DEC4B0'];

  habitChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors.slice(0, labels.length),
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });
}

function renderRewards(user) {
  const container = document.getElementById('rewards-summary');
  const rewards = user.rewards || [];
  container.innerHTML = `
    <div style="margin-bottom:16px;">
      <div class="stats-value">${user.total_raw_points}</div>
      <div class="stats-label">累计原始积分</div>
    </div>
    ${rewards.map((r, i) => `
      <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <div>
          <span>${r.label}</span>
          <span style="color:${r.claimed ? 'var(--accent-dark)' : 'var(--text-muted)'};font-size:0.85em;margin-left:8px;">
            ${r.claimed ? '✅ 已兑换' : `${r.threshold} 分`}
          </span>
        </div>
        <button class="habit-del-btn2" onclick="deleteReward(${i})" style="font-size:0.8em;padding:2px 8px;">×</button>
      </div>
    `).join('')}
  `;
}

function showRewardForm() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'reward-modal';
  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-title">新增奖励</div>
      <div class="form-group">
        <label>奖励名称</label>
        <input id="rf-label" placeholder="如: 🍰 吃蛋糕" />
      </div>
      <div class="form-group">
        <label>所需积分</label>
        <input id="rf-threshold" type="number" value="100" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('reward-modal')">取消</button>
        <button class="btn-primary" onclick="saveReward()">保存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function saveReward() {
  const label = document.getElementById('rf-label').value.trim();
  const threshold = parseInt(document.getElementById('rf-threshold').value) || 100;
  if (!label) { alert('请填写完整'); return; }
  await fetch('/api/rewards', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_id: currentUserId, threshold, label})
  });
  closeModal('reward-modal');
  await loadDashboard();
}

async function deleteReward(idx) {
  const user = dashboardData.find(u => u.id === currentUserId);
  const rewards = user?.rewards || [];
  const reward = rewards[idx];
  if (!reward || !reward.id) { alert('未找到该奖励'); return; }
  if (reward.claimed) { alert('已兑换的奖励不能删除'); return; }
  if (!confirm(`确定删除「${reward.label}」？`)) return;
  await fetch(`/api/rewards/${reward.id}`, {method: 'DELETE'});
  await loadDashboard();
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function renderDailyDetail(user) {
  const tbody = document.getElementById('detail-body');
  const records = user.daily_records || {};
  const dates = Object.keys(records).sort().reverse().slice(0, 30);
  tbody.innerHTML = dates.map(date => {
    const items = records[date] || [];
    return `<tr><td>${date}</td><td>${items.join(', ') || '-'}</td><td>${items.length}</td></tr>`;
  }).join('');
}

/* ── Habit Management (Admin) ── */

let habitsData = [];

async function loadHabits() {
  const r = await fetch('/api/habits?user_id=me');
  habitsData = await r.json();
  renderHabitList();
}

function renderHabitList() {
  const container = document.getElementById('habit-list');
  if (!habitsData.length) {
    container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">暂无习惯，点击上方「+ 新增」添加</div>';
    return;
  }
  container.innerHTML = habitsData.map((h, i) => `
    <div class="habit-item-admin" draggable="true"
         data-key="${h.key}"
         ondragstart="handleDragStart(event, ${i})"
         ondragover="handleDragOver(event, ${i})"
         ondragend="handleDragEnd(event)"
         ondrop="handleDrop(event, ${i})">
      <span class="drag-handle">⠿</span>
      <span class="habit-info">${h.label}</span>
      <span class="habit-pts">${h.points} 分</span>
      <button class="habit-edit-btn2" onclick="showHabitForm('${h.key}','${h.label.replace(/'/g,"\\'")}',${h.points})">编辑</button>
      <button class="habit-del-btn2" onclick="deleteHabit('${h.key}','${h.label.replace(/'/g,"\\'")}')">×</button>
    </div>
  `).join('');
}

let dragIndex = null;

function handleDragStart(e, idx) {
  dragIndex = idx;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.habit-item-admin').forEach(el => el.classList.remove('drag-over'));
}

function handleDrop(e, dropIdx) {
  e.preventDefault();
  const el = e.target.closest('.habit-item-admin');
  if (el) el.classList.remove('drag-over');
  if (dragIndex === null || dragIndex === dropIdx) return;
  const item = habitsData.splice(dragIndex, 1)[0];
  habitsData.splice(dropIdx, 0, item);
  dragIndex = null;
  renderHabitList();
  saveOrder();
}

async function saveOrder() {
  const ordered = habitsData.map((h, i) => ({key: h.key, sort_order: i}));
  await fetch('/api/habits/reorder', {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({habits: ordered})
  });
}

function showHabitForm(key, label, points) {
  const isEdit = !!key;
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'habit-modal';
  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-title">${isEdit ? '编辑习惯' : '新增习惯'}</div>
      <div class="form-group">
        <label>标识符（英文，唯一，保存后不可修改）</label>
        <input id="hf-key" value="${isEdit ? key : ''}" ${isEdit ? 'readonly' : ''} placeholder="如: running" />
      </div>
      <div class="form-group">
        <label>显示名称</label>
        <input id="hf-label" value="${isEdit ? label : ''}" placeholder="如: 🏃 跑步" />
      </div>
      <div class="form-group">
        <label>积分</label>
        <input id="hf-points" type="number" value="${isEdit ? points : '10'}" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('habit-modal')">取消</button>
        <button class="btn-primary" onclick="saveHabit()">保存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function saveHabit() {
  const key = document.getElementById('hf-key').value.trim();
  const label = document.getElementById('hf-label').value.trim();
  const points = parseInt(document.getElementById('hf-points').value) || 10;
  if (!key || !label) { alert('请填写完整'); return; }
  await fetch('/api/habits', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_id: 'me', key, label, points, sort_order: 99})
  });
  closeModal('habit-modal');
  await loadHabits();
}

async function deleteHabit(key, label) {
  if (!confirm(`确定删除「${label}」？所有用户的此习惯和相关记录都会被清空。`)) return;
  if (!confirm('再次确认：此操作不可撤销。')) return;
  await fetch(`/api/habits/${key}`, {method: 'DELETE'});
  await loadHabits();
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}
</script>
</body>
