<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="✨ 小进步">
<title>✨ 小进步</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

:root {
  --bg: #FDF6EE; --bg-card: #FFFFFF; --bg-secondary: #F2E8DC;
  --accent: #A8C9A5; --accent-dark: #8B9D83; --highlight: #F4C7AB;
  --border: #E8D5C4; --text: #4A3F35; --text-muted: #9C8B7A;
  --radius: 16px; --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(74,63,53,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #2A2520; --bg-card: #3A3430; --bg-secondary: #322D28;
    --border: #4A4440; --text: #E8DDD4; --text-muted: #9C8F82;
    --shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
}

/* ── Tab page container ── */
#main-content {
  flex: 1; padding: 20px 20px 100px; overflow-y: auto;
  position: relative;
}
.tab-page {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  padding: 20px 20px 100px;
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1),
              transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-page.active {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}
.tab-page.exit {
  opacity: 0; transform: translateY(-8px);
}

/* ── Tab icon active animation ── */
.tab-btn { transition: color 0.2s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab-btn:active { transform: scale(0.92); }
.tab-btn.active { color: var(--accent-dark); font-weight: 600; position: relative; transform: scale(1); }
.tab-btn.active span { display: inline-block; animation: tabPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes tabPop {
  0% { transform: scale(0.85); }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
.tab-btn.active::after {
  content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 3px; border-radius: 2px; background: var(--accent-dark);
}

/* ── Skeleton loading ── */
.skeleton { background:linear-gradient(90deg,var(--bg-secondary) 25%,var(--border) 50%,var(--bg-secondary) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:var(--radius); }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-bar { height:18px; margin-bottom:12px; border-radius:8px; }
.skel-card { height:68px; margin-bottom:12px; border-radius:var(--radius); }

/* ── Celebration overlay ── */
.celebrate-overlay { position:fixed; top:0; left:0; right:0; bottom:0; z-index:200; pointer-events:none; }
.celebrate-particle { position:absolute; animation:particleFall 2s ease-out forwards; font-size:1.5em; }
@keyframes particleFall {
  0%   { opacity:1; transform:translateY(-40px) rotate(0deg) scale(1); }
  70%  { opacity:1; }
  100% { opacity:0; transform:translateY(100vh) rotate(720deg) scale(0.3); }
}

/* ── User select ceremony ── */
.user-select-top { margin-bottom:48px; }
.user-select-date { font-size:1em; color:var(--text-muted); margin-bottom:8px; }
.user-select-motto { font-size:0.9em; color:var(--accent-dark); font-style:italic; }

.page { display: none; }
.page.active { display: flex; }

#page-user-select { align-items: center; justify-content: center; min-height: 100dvh; padding: 24px; }
.user-select-container { text-align: center; }
.app-title { font-size: 2.2em; margin-bottom: 8px; font-weight: 700; }
.app-subtitle { color: var(--text-muted); margin-bottom: 36px; font-size: 1em; }
.user-buttons { display: flex; gap: 20px; justify-content: center; }
.user-btn {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  background: var(--bg-card); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 32px 44px;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow); -webkit-tap-highlight-color: transparent;
}
.user-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(74,63,53,0.12); }
.user-btn:active { transform: scale(0.96); }
.user-btn-emoji { font-size: 3.2em; }
.user-btn-label { font-size: 1.2em; font-weight: 600; color: var(--text); }

#page-main { flex-direction: column; min-height: 100dvh; }
#main-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; background: var(--bg); position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid var(--border);
}
.header-left { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.05em; }
.header-points { font-weight: 600; color: var(--accent-dark); }
#main-content { flex: 1; position: relative; }

#bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; background: var(--bg-card); border-top: 1px solid var(--border);
  padding: 6px 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); z-index: 20;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; font-size: 0.72em; color: var(--text-muted);
  cursor: pointer; padding: 4px 0; transition: color 0.2s; -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { color: var(--accent-dark); font-weight: 600; position: relative; }
.tab-btn.active::after {
  content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 3px; border-radius: 2px; background: var(--accent-dark);
}
.tab-btn span { font-size: 0.85em; }

.section-title { font-size: 1.3em; font-weight: 600; margin-bottom: 16px; margin-top: 4px; }
.section-subtitle { font-size: 1em; font-weight: 500; margin-bottom: 12px; color: var(--text-muted); }

.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 1.1em; }

.checkin-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.habit-item {
  display: flex; align-items: center; gap: 16px;
  background: var(--bg-card); border-radius: var(--radius);
  padding: 16px 20px; box-shadow: var(--shadow);
  cursor: pointer; transition: all 0.25s ease;
  border: 2px solid transparent; -webkit-tap-highlight-color: transparent; user-select: none;
}
.habit-item:active { transform: scale(0.97); }
.habit-item.done { opacity: 0.55; background: var(--bg-secondary); }
.habit-check {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border); display: flex;
  align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.9em; flex-shrink: 0;
  transition: all 0.3s ease; color: transparent;
}
.habit-check.checked { background: var(--accent); border-color: var(--accent); color: white; }
.habit-info { flex: 1; }
.habit-label { font-size: 1.05em; margin-bottom: 2px; }
.habit-points { font-size: 0.82em; color: var(--text-muted); }

.daily-summary {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
  display: flex; gap: 20px;
}
.summary-item { flex: 1; display: flex; flex-direction: column; gap: 4px; text-align: center; }
.summary-item span { font-size: 0.85em; color: var(--text-muted); }
.summary-item strong { font-size: 1.3em; }

.stats-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
.stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.95em; }
.progress-bar { height: 8px; background: var(--bg-secondary); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.5s ease; }
.stat-pct { text-align: right; font-size: 0.85em; color: var(--text-muted); margin-top: 4px; }

.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
.cal-weekday { text-align: center; font-size: 0.78em; color: var(--text-muted); padding: 8px 0; font-weight: 500; }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; border-radius: var(--radius-sm); font-size: 0.85em;
  position: relative; transition: background 0.2s;
}
.cal-day.today { border: 2px solid var(--highlight); font-weight: 700; }
.cal-day.full { background: var(--accent); color: white; font-weight: 600; }
.cal-day.partial { background: var(--bg-secondary); }
.cal-day.empty { background: none; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; position: absolute; bottom: 5px; }
.cal-dot.full { background: var(--accent-dark); }

.stats-combo { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
.stats-item { background:var(--bg-card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); text-align:center; }
.stats-item-label { font-size:0.85em; color:var(--text-muted); margin-bottom:4px; }
.stats-item-pct { font-size:1.6em; font-weight:700; color:var(--accent-dark); }
.stats-item-detail { font-size:0.8em; color:var(--text-muted); margin-bottom:8px; }
.stats-item .progress-bar { margin-top:4px; }

.total-points-card {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white; border-radius: var(--radius); padding: 24px;
  text-align: center; margin-bottom: 24px; box-shadow: var(--shadow);
}
.total-points-label { display: block; font-size: 0.9em; opacity: 0.85; margin-bottom: 4px; }
.total-points-value { display: block; font-size: 3em; font-weight: 700; letter-spacing: 2px; }
.total-points-sub { display: block; font-size: 0.78em; opacity: 0.7; margin-top: 6px; font-weight: 400; }
.rewards-list { display: flex; flex-direction: column; gap: 12px; }
.reward-item {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 16px 20px; box-shadow: var(--shadow);
  border: 2px solid var(--border); transition: all 0.3s;
}
.reward-item.unlocked { border-color: var(--accent); background: #F0F7EE; }
.reward-label { font-size: 1.05em; margin-bottom: 2px; }
.reward-threshold { font-size: 0.82em; color: var(--text-muted); }
.reward-bar-track { height: 6px; background: var(--bg-secondary); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.reward-bar-fill { height: 100%; background: var(--highlight); border-radius: 99px; transition: width 0.5s ease; }
.claim-btn {
  margin-top: 12px; background: var(--accent-dark); color: white;
  border: none; border-radius: var(--radius-sm); padding: 8px 20px;
  font-size: 0.9em; cursor: pointer; transition: background 0.2s;
}
.claim-btn:hover { background: var(--accent); }

.weekly-card { background:linear-gradient(135deg,var(--bg-card),var(--bg-secondary)); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:20px; border:2px solid var(--border); }
.weekly-header { font-weight:600; margin-bottom:10px; color:var(--accent-dark); }
.weekly-sub { font-size:0.82em; color:var(--text-muted); margin-top:4px; }
.weekly-badge { margin-top:10px; padding:8px 14px; background:var(--accent); color:white; border-radius:8px; font-size:0.9em; font-weight:600; text-align:center; }
.weekly-tip { margin-top:6px; font-size:0.82em; color:var(--text-muted); }

/* ── Broadcast ticker ── */
.broadcast-ticker {
  background: linear-gradient(135deg, #8B9D83, #A8C9A5);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  cursor: pointer;
  user-select: none;
}
.broadcast-ticker .ticker-icon {
  background: rgba(255,255,255,0.25);
  border-radius: 6px;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.broadcast-ticker .ticker-icon span { color: white; font-size: 0.85em; }
.broadcast-ticker .ticker-stage {
  flex: 1; min-width: 0; height: 24px;
  overflow: hidden; position: relative;
}
.broadcast-ticker .ticker-item {
  position: absolute; left: 0; right: 0;
  display: flex; align-items: center; gap: 6px;
  height: 24px; transition: transform 0.35s ease, opacity 0.35s ease;
}
.broadcast-ticker .ticker-text {
  font-size: 0.85em; color: white;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.broadcast-ticker .ticker-time {
  font-size: 0.72em; color: rgba(255,255,255,0.6);
  white-space: nowrap; flex-shrink: 0;
}
.broadcast-ticker .ticker-dots {
  display: flex; gap: 3px; flex-shrink: 0; align-items: center;
}
.broadcast-ticker .ticker-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: background 0.3s;
}
.broadcast-ticker .ticker-dot.active { background: white; }
.broadcast-ticker .ticker-more {
  color: rgba(255,255,255,0.7);
  font-size: 0.78em; flex-shrink: 0;
}

.settings-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.setting-title { font-weight: 600; margin-bottom: 12px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.setting-btn {
  width: 100%; padding: 12px; border: 2px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg-card);
  cursor: pointer; font-size: 0.95em; margin-bottom: 8px;
  transition: background 0.2s; color: var(--text);
}
.setting-btn:hover { background: var(--bg-secondary); }
.setting-btn.danger { border-color: #E8A0A0; color: #B84A4A; }
.setting-btn.danger:hover { background: #FFF0F0; }
.habit-setting {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.habit-setting:last-child { border-bottom: none; }
.points-badge {
  background: var(--bg-secondary); padding: 2px 10px;
  border-radius: 99px; font-size: 0.82em; color: var(--text-muted);
}
.habit-actions { display: flex; gap: 8px; align-items: center; }
.habit-edit-btn, .habit-del-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 10px; font-size: 0.8em; cursor: pointer; transition: background 0.2s;
}
.habit-edit-btn:hover { background: var(--bg-secondary); }
.habit-del-btn { border-color: #E8A0A0; color: #B84A4A; }
.habit-del-btn:hover { background: #FFF0F0; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-card {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal-title { font-size: 1.1em; font-weight: 600; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 4px; }
.form-group input {
  width: 100%; padding: 10px 12px; border: 2px solid var(--border);
  border-radius: 8px; font-size: 0.95em; background: var(--bg-card); color: var(--text);
}
.form-group input:focus { outline: none; border-color: var(--accent); }
.modal-actions { display: flex; gap: 12px; margin-top: 20px; }
.modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.95em; cursor: pointer; }
.btn-primary {
  background: var(--accent-dark); color: white; border: none;
}
.btn-secondary { background: var(--bg-secondary); color: var(--text); border: 1px solid var(--border); }

.reward-management { margin-top: 16px; }
.reward-setting {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.reward-setting:last-child { border-bottom: none; }
.about-text { text-align: center; color: var(--text-muted); font-size: 0.85em; padding: 24px 0; }

.version-card { background: var(--bg-card); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); margin-bottom: 12px; border-left: 3px solid var(--accent); }
.version-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.version-tag { font-weight: 700; font-size: 0.95em; color: var(--accent-dark); }
.version-date { font-size: 0.78em; color: var(--text-muted); }
.version-title { font-size: 0.88em; color: var(--text); margin-bottom: 8px; font-weight: 500; }
.version-changes { list-style: none; padding: 0; }
.version-changes li { font-size: 0.82em; color: var(--text-muted); padding: 2px 0; padding-left: 14px; position: relative; line-height: 1.5; }
.version-changes li::before { content: '•'; position: absolute; left: 0; color: var(--accent); }
</style>
</head>
<body>

<div id="app">
<div id="page-user-select" class="page active">
  <div class="user-select-container">
    <div class="user-select-top">
      <div class="user-select-date" id="welcome-date"></div>
      <div class="app-title">✨ 小进步</div>
      <div class="user-select-motto" id="daily-motto"></div>
    </div>
    <p class="app-subtitle">选一个人开始打卡</p>
    <div class="user-buttons">
      <button class="user-btn" onclick="APP.selectUser('me')">
        <span class="user-btn-emoji">🙋</span>
        <span class="user-btn-label">我</span>
      </button>
      <button class="user-btn" onclick="APP.selectUser('wife')">
        <span class="user-btn-emoji">👑</span>
        <span class="user-btn-label">女王大人</span>
      </button>
    </div>
  </div>
</div>

<div id="page-main" class="page">
  <header id="main-header">
    <div class="header-left">
      <span id="header-user-emoji"></span>
      <span id="header-user-name"></span>
    </div>
    <span id="header-points" class="header-points">⭐ 0 分</span>
  </header>
  <main id="main-content">
    <div class="tab-page active" id="tab-checkin"></div>
    <div class="tab-page" id="tab-progress"></div>
    <div class="tab-page" id="tab-rewards"></div>
    <div class="tab-page" id="tab-broadcast"></div>
    <div class="tab-page" id="tab-settings"></div>
  </main>
  <nav id="bottom-nav">
    <button class="tab-btn active" data-tab="checkin" onclick="APP.switchTab('checkin')">📋<span>打卡</span></button>
    <button class="tab-btn" data-tab="progress" onclick="APP.switchTab('progress')">📊<span>进度</span></button>
    <button class="tab-btn" data-tab="rewards" onclick="APP.switchTab('rewards')">🏆<span>奖励</span></button>
    <button class="tab-btn" data-tab="broadcast" onclick="APP.switchTab('broadcast')">📢<span>动态</span></button>
    <button class="tab-btn" data-tab="settings" onclick="APP.switchTab('settings')">⚙️<span>设置</span></button>
  </nav>
</div>
</div>

<script>
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function escapeAttr(value) {
  return escapeHTML(value);
}

function localDateString(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

const API = {
  async login(userId) {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: userId})
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `请求失败 (${r.status})`);
    }
    return r.json();
  },
  async toggle(userId, habitKey) {
    const r = await fetch('/api/toggle', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: userId, habit_key: habitKey})
    });
    return r.json();
  },
  async getPoints(userId) {
    const r = await fetch(`/api/points?user_id=${userId}`);
    return r.json();
  },
  async getMonthRecords(userId, year, month) {
    const r = await fetch(`/api/records/month?user_id=${userId}&year=${year}&month=${month}`);
    return r.json();
  },
  async getWeekStats(userId) {
    const r = await fetch(`/api/week-stats?user_id=${userId}`);
    return r.json();
  },
  async getHabits(userId) {
    const r = await fetch(`/api/habits?user_id=${userId}`);
    return r.json();
  },
  async createHabit(userId, key, label, points) {
    const r = await fetch('/api/habits', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: userId, key, label, points, sort_order: 99})
    });
    return r.json();
  },
  async deleteHabit(key) {
    const r = await fetch(`/api/habits/${key}`, {method: 'DELETE'});
    return r.json();
  },
  async claimReward(userId, rewardId) {
    const r = await fetch('/api/rewards/claim', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: userId, reward_id: rewardId})
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'error'); }
    return r.json();
  },
  async getBroadcasts() {
    const r = await fetch('/api/broadcasts');
    return r.json();
  },
  async sendBroadcast(userId, content) {
    const r = await fetch('/api/broadcasts', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: userId, content})
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'error'); }
    return r.json();
  },
  async getRedemptionHistory(userId) {
    const r = await fetch(`/api/rewards/history?user_id=${userId}`);
    return r.json();
  },
  async createReward(userId, threshold, label) {
    const r = await fetch('/api/rewards', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: userId, threshold, label})
    });
    return r.json();
  },
  async clearRecords(userId) {
    const r = await fetch(`/api/records?user_id=${userId}`, {method: 'DELETE'});
    return r.json();
  }
};

const APP = {
  data: null,
  currentTab: 'checkin',
  broadcasts: [],
  broadcastTimer: null,
  broadcastIdx: 0,

  async selectUser(userId) {
    try {
      const data = await API.login(userId);
      if (!data?.user?.id) {
        throw new Error('登录响应格式异常，请刷新后重试');
      }
      this.data = data;
      localStorage.setItem('mb_user', userId);
      this.renderApp();
    } catch (e) {
      alert(e.message);
    }
  },

  async autoLogin() {
    const saved = localStorage.getItem('mb_user');
    if (saved) {
      try {
        this.data = await API.login(saved);
        this.renderApp();
        return true;
      } catch (_) {
        console.warn('Auto-login failed, showing user selection');
      }
    }
    return false;
  },

  renderApp() {
    document.getElementById('page-user-select').classList.remove('active');
    document.getElementById('page-main').classList.add('active');
    const d = this.data;
    document.getElementById('header-user-emoji').textContent = d.user.emoji;
    document.getElementById('header-user-name').textContent = d.user.display_name;
    this.updateHeader();
    this.switchTab('checkin');
  },

  async updateHeader() {
    const pts = await API.getPoints(this.data.user.id);
    document.getElementById('header-points').textContent = `⭐ ${pts.available} 分`;
  },

  switchTab(tab) {
    if (tab !== 'checkin') this.stopBroadcastTicker();
    this.currentTab = tab;

    // Tab button active state
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
    if (btn) btn.classList.add('active');

    // Page transition
    const current = document.querySelector('.tab-page.active');
    const next = document.getElementById(`tab-${tab}`);
    if (!next) return;

    // Same tab but not rendered yet (initial load): render without animation
    if (current === next) {
      if (!next.dataset.rendered) {
        this.renderTabContent(tab);
        next.dataset.rendered = 'true';
      }
      return;
    }

    // Always re-render broadcast and rewards tabs for fresh data; cache other tabs
    if (tab === 'broadcast' || tab === 'rewards' || !next.dataset.rendered) {
      if (tab !== 'broadcast') {
        next.innerHTML = '<div class="skeleton skel-bar"></div><div class="skeleton skel-card"></div>';
      }
      this.renderTabContent(tab);
      next.dataset.rendered = 'true';
    }

    // Animate: current fades out, next fades in
    current.classList.remove('active');
    current.classList.add('exit');
    next.classList.add('active');
    // Cleanup exit state after transition
    setTimeout(() => current.classList.remove('exit'), 250);
  },

  renderTabContent(tab) {
    switch (tab) {
      case 'checkin': this.renderCheckin(); break;
      case 'progress': this.renderProgress(); break;
      case 'rewards': this.renderRewards(); break;
      case 'broadcast': this.renderBroadcastTab(); break;
      case 'settings': this.renderSettings(); break;
    }
  },

  /* ── Check-in ── */
  async renderCheckin() {
    const d = this.data;
    const records = d.today_records || {};
    const habits = d.habits;

    // Load broadcasts for ticker
    let tickerHtml = '';
    try {
      const allBroadcasts = await API.getBroadcasts();
      this.broadcasts = allBroadcasts;
      tickerHtml = this.renderBroadcastTicker(allBroadcasts);
    } catch (e) { /* broadcasts are optional */ }

    let html = '<div class="section-title">📋 今日打卡</div>';
    html += tickerHtml;
    html += '<div class="checkin-list">';

    habits.forEach(h => {
      const done = records[h.key];
      html += `
        <div class="habit-item ${done ? 'done' : ''}" data-key="${escapeAttr(h.key)}" onclick="APP.toggle(this.dataset.key)">
          <div class="habit-check ${done ? 'checked' : ''}">${done ? '✓' : ''}</div>
          <div class="habit-info">
            <div class="habit-label">${escapeHTML(h.label)}</div>
            <div class="habit-points">+${h.points} 分</div>
          </div>
        </div>`;
    });
    html += '</div>';

    let dayPoints = 0;
    habits.forEach(h => { if (records[h.key]) dayPoints += h.points; });
    const maxDay = habits.reduce((s, h) => s + h.points, 0);

    html += `
      <div class="daily-summary">
        <div class="summary-item"><span>今日得分</span><strong>${dayPoints} / ${maxDay}</strong></div>
        <div class="summary-item"><span>总积分</span><strong id="checkin-total">${d._pointsCache || '...'}</strong></div>
      </div>`;
    document.getElementById('tab-checkin').innerHTML = html;

    API.getPoints(d.user.id).then(pts => {
      d._pointsCache = pts.available;
      document.getElementById('checkin-total').textContent = pts.available;
    });

    this.startBroadcastTicker();
  },

  async toggle(key) {
    // Optimistic local update first
    const d = this.data;
    const records = d.today_records || {};
    records[key] = !records[key];
    d.today_records = records;
    this.renderCheckin();

    // Fire API in background
    try {
      await API.toggle(d.user.id, key);
      // Update points cache
      const pts = await API.getPoints(d.user.id);
      d._pointsCache = pts.available;
      this.updateHeader();
      checkCelebrate();
    } catch (e) {
      // Revert on failure
      records[key] = !records[key];
      this.renderCheckin();
    }
  },

  /* ── Progress ── */
  async renderProgress() {
    const d = this.data;
    const today = new Date();
    const todayStr = localDateString(today);
    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    const firstDay = new Date(year, month - 1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    const hCount = d.habits.length;

    document.getElementById('tab-progress').innerHTML = '<div class="skeleton skel-bar" style="width:60%;"></div><div class="skeleton skel-card"></div><div class="skeleton" style="height:200px;margin-bottom:20px;"></div>';

    let monthRecords, weekStats;
    try {
      [monthRecords, weekStats] = await Promise.all([
        API.getMonthRecords(d.user.id, year, month),
        API.getWeekStats(d.user.id),
      ]);
    } catch (e) {
      document.getElementById('tab-progress').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:1em;">加载失败，请检查网络</div>';
      return;
    }

    let html = '<div class="section-title">📊 进度总览</div>';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
    const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

    // Calendar on top
    html += `<div class="section-subtitle" style="margin-bottom:0;">${monthNames[month-1]} ${year}</div>`;
    html += '<div style="display:flex;gap:10px;font-size:0.75em;color:var(--text-muted);">';
    html += '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:3px;"></span>全部</span>';
    html += '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--bg-secondary);vertical-align:middle;margin-right:3px;"></span>部分</span>';
    html += '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--border);vertical-align:middle;margin-right:3px;"></span>未做</span>';
    html += '</div></div>';
    html += '<div class="calendar-grid">';
    ['日','一','二','三','四','五','六'].forEach(d => { html += `<div class="cal-weekday">${d}</div>`; });
    for (let i = 0; i < firstDay; i++) { html += '<div class="cal-day empty"></div>'; }

    let monthDone = 0, monthTotal = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayData = monthRecords[dateStr];
      const doneCount = dayData ? dayData.done_count : 0;
      const isToday = dateStr === todayStr;
      const isFuture = dateStr > todayStr;
      const allDone = doneCount === hCount;
      const partialDone = doneCount > 0;
      html += `<div class="cal-day ${isToday ? 'today' : ''} ${isFuture ? '' : allDone ? 'full' : partialDone ? 'partial' : ''}">${d}`;
      if (!isFuture && allDone) html += '<div class="cal-dot full"></div>';
      html += '</div>';
      if (!isFuture) { monthDone += doneCount; monthTotal += hCount; }
    }
    html += '</div>';

    // Weekly + Monthly stats together
    const monthPct = monthTotal ? Math.round(monthDone / monthTotal * 100) : 0;
    html += '<div class="stats-combo">';
    html += `
      <div class="stats-item">
        <div class="stats-item-label">📅 本周</div>
        <div class="stats-item-pct">${weekStats.pct}%</div>
        <div class="stats-item-detail">${weekStats.done}/${weekStats.total}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${weekStats.pct}%"></div></div>
      </div>`;
    html += `
      <div class="stats-item">
        <div class="stats-item-label">📈 本月</div>
        <div class="stats-item-pct">${monthPct}%</div>
        <div class="stats-item-detail">完成率</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${monthPct}%"></div></div>
      </div>`;
    html += '</div>';

    document.getElementById('tab-progress').innerHTML = html;
  },

  renderBroadcastTicker(broadcasts) {
    if (!broadcasts || !broadcasts.length) return '';
    const len = broadcasts.length;
    const cur = broadcasts[this.broadcastIdx % len];
    const next = broadcasts[(this.broadcastIdx + 1) % len];
    const curIcon = cur.type === 'manual' ? '💬' : '🔔';
    const nextIcon = next.type === 'manual' ? '💬' : '🔔';

    let dotsHtml = '';
    const maxDots = Math.min(len, 8);
    for (let i = 0; i < maxDots; i++) {
      dotsHtml += `<div class="ticker-dot ${i === (this.broadcastIdx % maxDots) ? 'active' : ''}"></div>`;
    }

    return `<div class="broadcast-ticker" onclick="APP.switchTab('broadcast')">
      <div class="ticker-icon"><span>📢</span></div>
      <div class="ticker-stage" id="ticker-stage">
        <div class="ticker-item" style="transform:translateY(0);opacity:1;">
          <span class="ticker-text">${escapeHTML(cur.user_emoji)} ${escapeHTML(cur.user_display_name)} ${escapeHTML(cur.content)}</span>
          <span class="ticker-time">${curIcon} ${this.timeAgo(cur.created_at)}</span>
        </div>
        <div class="ticker-item" style="transform:translateY(24px);opacity:0;pointer-events:none;">
          <span class="ticker-text">${escapeHTML(next.user_emoji)} ${escapeHTML(next.user_display_name)} ${escapeHTML(next.content)}</span>
          <span class="ticker-time">${nextIcon} ${this.timeAgo(next.created_at)}</span>
        </div>
      </div>
      <div class="ticker-dots">${dotsHtml}</div>
      <span class="ticker-more">更多 ›</span>
    </div>`;
  },

  updateTickerView() {
    // Animate: slide current up and out, slide next into view
    if (!this.broadcasts.length) return;
    const stage = document.getElementById('ticker-stage');
    if (!stage) return;
    const items = stage.querySelectorAll('.ticker-item');
    if (items.length < 2) return;

    // Trigger slide animation
    items[0].style.transform = 'translateY(-24px)';
    items[0].style.opacity = '0';
    items[1].style.transform = 'translateY(0)';
    items[1].style.opacity = '1';

    // After animation completes, re-render with new index
    setTimeout(() => {
      this.broadcastIdx++;
      this.renderCheckin();
    }, 380);
  },

  timeAgo(isoStr) {
    const diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff/60) + '分钟前';
    if (diff < 86400) return Math.floor(diff/3600) + '小时前';
    return Math.floor(diff/86400) + '天前';
  },

  startBroadcastTicker() {
    this.stopBroadcastTicker();
    const tick = () => {
      this.updateTickerView();
      this.broadcastTimer = setTimeout(tick, 3500);
    };
    this.broadcastTimer = setTimeout(tick, 3500);
  },

  stopBroadcastTicker() {
    if (this.broadcastTimer) {
      clearTimeout(this.broadcastTimer);
      this.broadcastTimer = null;
    }
  },

  async renderBroadcastTab() {

      <span>${escapeHTML(d.user.emoji)}</span>

      <button class="claim-btn" onclick="APP.sendBroadcast()" style="padding:6px 16px;font-size:0.85em;">发送</button>

          html += `
          <div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;border:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${escapeHTML(b.user_emoji)}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:0.88em;color:var(--text);">
                <strong>${escapeHTML(b.user_display_name)}</strong> ${escapeHTML(b.content)}
              </div>
              <div style="font-size:0.75em;color:var(--text-muted);margin-top:3px;">${icon} ${timeAgo}</div>
            </div>
          </div>`;
        });
        html += '</div>';
      } else {
        html += '<div style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:0.9em;">暂无动态，开始打卡吧 💪</div>';
      }

      document.getElementById('tab-broadcast').innerHTML = html;
    } catch(e) {
      document.getElementById('tab-broadcast').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);">加载失败</div>';
    }
  },

  async sendBroadcast() {
    const input = document.getElementById('broadcast-input');
    if (!input || !input.value.trim()) return;
    try {
      await API.sendBroadcast(this.data.user.id, input.value.trim());
      input.value = '';
      this.renderBroadcastTab();
      // Refresh ticker data
      const allBroadcasts = await API.getBroadcasts();
      this.broadcasts = allBroadcasts;
    } catch(e) {
      alert(e.message);
    }
  },
};

/* ── Welcome page content ── */
const MOTTOS = ['坚持就是胜利 💪','今天的努力是明天的礼物 🎁','每一天都值得认真对待 ✨','变好的路上，你并不孤单 🌸','小小的坚持，大大的改变 🌱'];
function initWelcomePage() {
  const now = new Date();
  const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('welcome-date').textContent = `${months[now.getMonth()]}${now.getDate()}日 ${weekDays[now.getDay()]}`;
  document.getElementById('daily-motto').textContent = MOTTOS[now.getDate() % MOTTOS.length];
}

/* ── Celebration check ── */
function checkCelebrate() {
  const d = APP.data;
  if (!d) return;
  const records = d.today_records || {};
  const allDone = d.habits.every(h => records[h.key]);
  if (!allDone) return;

  const colors = ['#A8C9A5','#F4C7AB','#E8D5C4','#8B9D83','#D4C4B0','#FFF8DC','#FFD700'];
  const particles = ['🌟','✨','🎉','🎊','💫','⭐','🌸','🍀','💎','🔥'];
  const overlay = document.createElement('div');
  overlay.className = 'celebrate-overlay';
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('span');
    p.className = 'celebrate-particle';
    p.textContent = particles[i % particles.length];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 1.2 + 's';
    p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    p.style.fontSize = (1 + Math.random() * 2) + 'em';
    overlay.appendChild(p);
  }
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 3000);
}

/* ── Init: auto-login on page load ── */
(function init() {
  initWelcomePage();
  const saved = localStorage.getItem('mb_user');
  if (saved) {
    document.getElementById('page-user-select').classList.remove('active');
    document.getElementById('page-main').classList.add('active');
    API.login(saved).then(data => {
      if (!data?.user?.id) {
        throw new Error('invalid data');
      }
      APP.data = data;
      APP.renderApp();
    }).catch(() => {
      localStorage.removeItem('mb_user');
      document.getElementById('page-user-select').classList.add('active');
      document.getElementById('page-main').classList.remove('active');
    });
  }
})();
</script>
